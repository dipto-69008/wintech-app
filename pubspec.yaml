name: wintech_agro
description: "Wintech Agro - Enterprise Resource Management"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  http: ^1.2.0
  http_parser: ^4.0.2
  shared_preferences: ^2.2.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  video_player: ^2.9.2
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/wintech.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1B9DD9"
  adaptive_icon_foreground: "assets/images/wintech.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
